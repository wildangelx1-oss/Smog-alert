
name: Monitoring smogu

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smog-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Przywroc stan alarmu
        uses: actions/cache/restore@v4
        with:
          path: alarm_state.json
          key: smog-state-${{ github.run_id }}
          restore-keys: |
            smog-state-

      - name: Sprawdz smog
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python smog.py

      - name: Zapisz stan alarmu
        uses: actions/cache/save@v4
        with:
          path: alarm_state.json
          key: smog-state-${{ github.run_id }}
